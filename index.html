<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Where is it? - AR English Game</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Fredoka One', 'Quicksand', sans-serif;
            background-color: #1a1a2e; /* Dark fallback background */
            touch-action: manipulation;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror camera for intuitive interaction */
        }
        
        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to the UI layer */
        }
        
        #ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Wrapper shouldn't block clicks */
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 40px 30px;
            text-align: center;
            max-width: 600px;
            width: 85%;
            pointer-events: auto; /* Buttons and panel can be clicked normally */
        }
        
        h1 { color: #2c3e50; font-size: 3em; margin-top: 0; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(255,255,255,0.7); }
        h2 { color: #34495e; font-size: 2em; margin-top: 0; }
        p { color: #34495e; margin-bottom: 25px; font-size: 1.2em; font-weight: bold; }
        
        .btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            font-size: 1.5em;
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            font-weight: bold;
            font-family: inherit;
        }
        
        .btn:hover, .btn.hovered {
            transform: scale(1.08);
            background: linear-gradient(135deg, #27ae60, #219653);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
        }
        
        .option-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            display: block;
            width: 100%;
            margin: 15px 0;
            padding: 20px;
            font-size: 1.3em;
            border-radius: 15px;
        }
        
        .option-btn:hover, .option-btn.hovered {
            background: linear-gradient(135deg, #2980b9, #1f6391);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
        }
        
        .question-img {
            max-height: 220px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background: white;
            padding: 10px;
            object-fit: contain;
            width: 100%;
        }

        #hand-status {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.2em;
            font-weight: bold;
            display: block;
            z-index: 30;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8em;
            z-index: 40;
            display: none;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }
        
        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .screen { display: none; }
        .active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #ar-cursor {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.5);
            background: rgba(46, 204, 113, 0.6);
            pointer-events: none; /* Must be none so it doesn't block hover raycasting */
            z-index: 50;
            display: none;
            transform: translate(-50%, -50%);
            transition: width 0.1s, height 0.1s, background-color 0.2s;
        }
        
        .ar-cursor-hovering {
            background: rgba(241, 196, 15, 0.8) !important;
            border-color: #f39c12 !important;
        }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
    
    <div id="hand-status">Initializing Camera & AI...</div>
    <div id="ar-cursor"></div>
    <div id="feedback-icon" class="feedback">✅</div>

    <div id="ui-layer">
        <!-- Start Screen -->
        <div id="screen-start" class="screen active glass-panel">
            <h1>Where is it?</h1>
            <p>Learn Prepositions with AR!</p>
            <p style="font-size: 1em; color: #555; font-weight: normal;">(Point your finger at the camera to hover, or click/tap the buttons normally!)</p>
            <button class="btn interactable" onclick="startGame()">Start Game!</button>
        </div>

        <!-- Game Screen -->
        <div id="screen-game" class="screen glass-panel">
            <h2 id="question-text">Question Text</h2>
            <!-- Image with onerror fallback to a placeholder text -->
            <img id="question-image" class="question-img" src="" alt="Question Image" 
                 onerror="this.onerror=null; this.src='https://placehold.co/600x400/eee/31343C?text=Image+File+Not+Found+in+Folder'">
            <div id="options-container">
                <button class="btn option-btn interactable" onclick="checkAnswer(1)" id="opt-1">Option 1</button>
                <button class="btn option-btn interactable" onclick="checkAnswer(2)" id="opt-2">Option 2</button>
            </div>
        </div>

        <!-- End Screen -->
        <div id="screen-end" class="screen glass-panel">
            <h1>Very Good! 🎉</h1>
            <h2>Your Score: <span id="final-score" style="color: #27ae60; font-size: 1.5em;">0</span> / 10</h2>
            <button class="btn interactable" onclick="resetGame()">Play Again</button>
        </div>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Where is the book?",
            img: "1_0.png",
            options: ["The book is on the desk.", "The book is in the bag."],
            correct: 0
        },
        {
            q: "Where is the eraser?",
            img: "2_0.png",
            options: ["The eraser is in the bag.", "The eraser is under the desk."],
            correct: 1
        },
        {
            q: "Where is the folder?",
            img: "3_0.png",
            options: ["The folder is in the box.", "The folder is on the chair."],
            correct: 1
        },
        {
            q: "Where is the pen?",
            img: "4_0.jpg",
            options: ["The pen is in the pencil case.", "The pen is on the chair."],
            correct: 0
        },
        {
            q: "Where is the pencil?",
            img: "5_0.jpg",
            options: ["The pencil is in the bag.", "The pencil is on the book."],
            correct: 1
        }
    ];

    let currentQ = 0;
    let score = 0;
    let isProcessingAnswer = false;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startGame() {
        currentQ = 0;
        score = 0;
        isProcessingAnswer = false;
        showScreen('screen-game');
        loadQuestion();
    }

    function loadQuestion() {
        isProcessingAnswer = false;
        const qData = questions[currentQ];
        
        document.getElementById('question-text').innerText = `Question ${currentQ + 1}/5: ${qData.q}`;
        
        // Reset src and let the browser load it (or trigger onerror)
        const imgEl = document.getElementById('question-image');
        imgEl.src = qData.img;
        
        // Setup options
        document.getElementById('opt-1').innerText = qData.options[0];
        document.getElementById('opt-2').innerText = qData.options[1];
    }

    function checkAnswer(selectedIndex) {
        if (isProcessingAnswer) return;
        isProcessingAnswer = true;
        
        const qData = questions[currentQ];
        const feedback = document.getElementById('feedback-icon');
        
        // Force reflow to restart CSS animation
        feedback.style.animation = 'none';
        feedback.offsetHeight; 
        feedback.style.animation = null;
        
        feedback.style.display = 'block';

        // Check if selected option index (0 or 1) matches correct answer
        if (selectedIndex - 1 === qData.correct) {
            feedback.innerText = '✅';
            score += 2; // 2 points per correct question
        } else {
            feedback.innerText = '❌';
        }

        setTimeout(() => {
            feedback.style.display = 'none';
            currentQ++;
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }, 1500); // 1.5 seconds delay before the next screen
    }

    function endGame() {
        document.getElementById('final-score').innerText = score;
        showScreen('screen-end');
    }

    function resetGame() {
        showScreen('screen-start');
    }

    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const handStatus = document.getElementById('hand-status');
    const arCursor = document.getElementById('ar-cursor');

    let hoverTarget = null;
    let hoverProgress = 0;
    const HOVER_MAX = 25; // Roughly 0.8s hover time required
    let aiInitialized = false;

    function onResults(results) {
        if (!aiInitialized) {
            handStatus.innerText = "Show hands 🖐️ or Click buttons!";
            aiInitialized = true;
        }

        // Keep canvas size synced with video element dynamically
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            handStatus.style.display = 'none';
            arCursor.style.display = 'block';

            // Isolate index finger tip (Landmark 8)
            const indexFinger = results.multiHandLandmarks[0][8];
            
            // Map camera coordinates to viewport (Mirrored)
            const cursorX = (1 - indexFinger.x) * window.innerWidth;
            const cursorY = indexFinger.y * window.innerHeight;

            arCursor.style.left = `${cursorX}px`;
            arCursor.style.top = `${cursorY}px`;

            // Detect collision with UI elements
            checkHover(cursorX, cursorY);
        } else {
            // Hand lost, hide cursor, fallback to mouse mode implicitly
            handStatus.style.display = 'block';
            arCursor.style.display = 'none';
            resetHover();
        }
    }

    function checkHover(x, y) {
        if (isProcessingAnswer) {
            resetHover();
            return;
        }

        const buttons = document.querySelectorAll('.interactable');
        let currentTarget = null;

        buttons.forEach(btn => {
            const rect = btn.getBoundingClientRect();
            // A bit of padding tolerance to make it easier to hover
            const tolerance = 15; 
            if (x >= (rect.left - tolerance) && x <= (rect.right + tolerance) && 
                y >= (rect.top - tolerance) && y <= (rect.bottom + tolerance)) {
                // Confirm the button is currently visible on screen
                if(btn.closest('.screen.active')) {
                    currentTarget = btn;
                }
            }
        });

        if (currentTarget) {
            if (hoverTarget !== currentTarget) {
                resetHover();
                hoverTarget = currentTarget;
                currentTarget.classList.add('hovered');
                arCursor.classList.add('ar-cursor-hovering');
            }
            
            hoverProgress++;
            // The cursor visually grows as the user hovers
            let scale = 40 + (hoverProgress * 2.5);
            arCursor.style.width = `${scale}px`;
            arCursor.style.height = `${scale}px`;

            if (hoverProgress >= HOVER_MAX) {
                // Simulate the click visually and programmatically
                arCursor.style.background = "rgba(255, 255, 255, 0.9)";
                setTimeout(() => {
                    currentTarget.click(); 
                    resetHover();
                }, 100);
            }
        } else {
            resetHover();
        }
    }

    function resetHover() {
        if (hoverTarget) {
            hoverTarget.classList.remove('hovered');
            hoverTarget = null;
        }
        hoverProgress = 0;
        arCursor.classList.remove('ar-cursor-hovering');
        arCursor.style.width = '40px';
        arCursor.style.height = '40px';
        arCursor.style.background = "rgba(46, 204, 113, 0.6)"; 
    }

    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});
    
    hands.setOptions({
        maxNumHands: 1, 
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });
    
    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            try {
                await hands.send({image: videoElement});
            } catch (error) {
                console.warn("Frame drop or processing error:", error);
            }
        },
        width: 1280,
        height: 720
    });
    
    // Auto-start the camera on window load
    window.onload = function() {
        camera.start().catch(err => {
            console.error("Camera access failed:", err);
            handStatus.innerText = "Camera access denied or unavailable 🚫";
            handStatus.style.background = "rgba(192, 57, 43, 0.9)";
        });
    };
</script>
</body>
</html>
